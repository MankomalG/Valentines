<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine? 💘</title>

  <style>
    :root{
      --bg1:#ffdde1;
      --bg2:#ee9ca7;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --pink:#ff4d6d;
      --pink2:#ff7aa2;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1000px 600px at 20% 20%, #fff7, transparent 60%),
                  radial-gradient(900px 500px at 80% 30%, #fff6, transparent 55%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
      padding: 20px;
    }

    /* floating hearts background */
    .heart{
      position:absolute;
      font-size: 18px;
      opacity:.55;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.08));
      pointer-events:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(20vh) scale(.8) rotate(0deg); opacity:.0; }
      10%{ opacity:.55; }
      to{ transform: translateY(-120vh) scale(1.3) rotate(25deg); opacity:0; }
    }

    .card{
      width:min(520px, 92vw);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px 22px 22px;
      text-align:center;
      position:relative;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.65);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .pulseDot{
      width:10px; height:10px; border-radius:50%;
      background: var(--pink);
      box-shadow: 0 0 0 0 rgba(255,77,109,.55);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(255,77,109,.55); }
      70%{ box-shadow: 0 0 0 10px rgba(255,77,109,0); }
      100%{ box-shadow: 0 0 0 0 rgba(255,77,109,0); }
    }

    h1{
      font-size: clamp(26px, 4vw, 38px);
      margin: 10px 0 10px;
      line-height:1.15;
    }
    .sub{
      margin: 0 auto 18px;
      max-width: 40ch;
      font-size: 15px;
      opacity: .85;
    }

    .bigHeart{
      width: 92px;
      height: 92px;
      margin: 10px auto 6px;
      border-radius: 24px;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.2)),
                  linear-gradient(135deg, var(--pink), var(--pink2));
      transform: rotate(6deg);
      box-shadow: 0 18px 40px rgba(255,77,109,.35);
      position:relative;
    }
    .bigHeart span{
      font-size: 44px;
      transform: rotate(-6deg);
      animation: bop 1.6s infinite;
    }
    @keyframes bop{
      0%,100%{ transform: rotate(-6deg) scale(1); }
      50%{ transform: rotate(-6deg) scale(1.08); }
    }

    .buttons{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 12px;
      position:relative;
      min-height: 56px;
    }

    button{
      border:0;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 16px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      font-weight: 650;
    }

    .yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 12px 24px rgba(255,77,109,.35);
    }
    .yes:hover{ transform: translateY(-2px); filter: brightness(1.03); }

    .no{
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
      position:relative; /* will become absolute when it starts dodging */
    }
    .no:hover{ transform: translateY(-2px); }

    .msg{
      margin-top: 18px;
      min-height: 56px;
      font-size: 18px;
      font-weight: 650;
    }
    .type{
      display:inline-block;
      border-right: 2px solid rgba(0,0,0,.35);
      padding-right: 3px;
      animation: caret .9s step-end infinite;
    }
    @keyframes caret{
      50%{ border-color: transparent; }
    }

    .tiny{
      font-size: 13px;
      opacity: .75;
      margin-top: 8px;
    }

    /* confetti */
    .confetti{
      position:absolute;
      width:10px; height:14px;
      opacity:.9;
      top:-20px;
      animation: confettiFall linear forwards;
      pointer-events:none;
    }
    @keyframes confettiFall{
      to{
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.95;
      }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="badge"><span class="pulseDot"></span> special question incoming 💌</div>

    <div class="bigHeart"><span>💘</span></div>
    <h1>Will you be my Valentine?</h1>
    <p class="sub">I promise snacks, compliments, and unlimited “you’re cute” energy.</p>

    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn">Yes 💖</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="tiny" id="hint">Tip: try hovering the “No” button 😄</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const msg    = document.getElementById("msg");
    const hint   = document.getElementById("hint");
    const buttons = document.getElementById("buttons");
    const card = document.getElementById("card");

    // --- Floating hearts in background ---
    const hearts = ["💗","💖","💘","💝","💞","💕"];
    function spawnHeart(){
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (12 + Math.random()*26) + "px";
      el.style.animationDuration = (4 + Math.random()*5) + "s";
      el.style.opacity = (0.25 + Math.random()*0.5).toFixed(2);
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
    setInterval(spawnHeart, 260);

    // --- Typewriter message ---
    function typewriter(text){
      msg.innerHTML = "";
      const span = document.createElement("span");
      span.className = "type";
      msg.appendChild(span);
      let i = 0;
      const t = setInterval(() => {
        span.textContent = text.slice(0, i++);
        if(i > text.length){
          clearInterval(t);
          span.classList.remove("type");
        }
      }, 35);
    }

    // --- Confetti burst ---
    function confettiBurst(count = 120){
      for(let i=0;i<count;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360} 90% 65%)`;
        c.style.animationDuration = (2.5 + Math.random()*2.2) + "s";
        c.style.transform = `translateY(0) rotate(${Math.random()*180}deg)`;
        document.body.appendChild(c);
        c.addEventListener("animationend", () => c.remove());
      }
    }

    // --- No button dodge (but keep it inside the card) ---
    let dodges = 0;
    function dodgeNo(){
      dodges++;
      // make it absolute inside buttons area
      noBtn.style.position = "absolute";

      const area = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const padding = 8;
      const maxX = area.width - btn.width - padding;
      const maxY = area.height - btn.height - padding;

      const x = Math.max(padding, Math.random() * Math.max(maxX, padding));
      const y = Math.max(padding, Math.random() * Math.max(maxY, padding));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      // playful hint escalation
      if(dodges === 3) hint.textContent = "Okayyyy that button is slippery 😭";
      if(dodges === 6) hint.textContent = "At this point… just say yes 😌💖";
      if(dodges >= 9) hint.textContent = "No has left the chat 🫠";
    }

    noBtn.addEventListener("mouseover", dodgeNo);
    noBtn.addEventListener("click", dodgeNo);

    // --- Yes click ---
    yesBtn.addEventListener("click", () => {
      yesBtn.disabled = true;
      noBtn.disabled = true;
      hint.textContent = "";

      card.style.transform = "scale(1.01)";
      card.style.transition = "transform .2s ease";

      typewriter("YAY!! 💖🥰 You just made me the happiest human ever!");
      confettiBurst(140);
    });

    // Make buttons area taller so "No" has space to dodge
    // (only after first dodge)
    noBtn.addEventListener("mouseover", () => {
      buttons.style.minHeight = "90px";
    }, { once: true });
  </script>
</body>
</html>
