<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine + Fun Quiz 💘</title>

  <style>
    :root{
      --bg1:#ffdde1;
      --bg2:#ee9ca7;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --pink:#ff4d6d;
      --pink2:#ff7aa2;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    *{ box-sizing:border-box; }
    body{
        margin:0;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:flex-start;   /* allow content to grow downward */
        font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
        color:var(--text);
        background:
          radial-gradient(1000px 600px at 20% 20%, #fff7, transparent 60%),
          radial-gradient(900px 500px at 80% 30%, #fff6, transparent 55%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        overflow-y:auto;          /* ✅ enable vertical scrolling */
        overflow-x:hidden;
        padding: 20px 20px 60px;  /* extra bottom space */
      }

    /* Floating hearts background */
    .heart{
      position:absolute;
      font-size: 18px;
      opacity:.55;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.08));
      pointer-events:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(20vh) scale(.8) rotate(0deg); opacity:.0; }
      10%{ opacity:.55; }
      to{ transform: translateY(-120vh) scale(1.3) rotate(25deg); opacity:0; }
    }

    .card{
       margin-top: 20px;
      width:min(560px, 92vw);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 26px 22px 22px;
      text-align:center;
      position:relative;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.65);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .pulseDot{
      width:10px; height:10px; border-radius:50%;
      background: var(--pink);
      box-shadow: 0 0 0 0 rgba(255,77,109,.55);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(255,77,109,.55); }
      70%{ box-shadow: 0 0 0 10px rgba(255,77,109,0); }
      100%{ box-shadow: 0 0 0 0 rgba(255,77,109,0); }
    }

    h1{
      font-size: clamp(26px, 4vw, 38px);
      margin: 10px 0 10px;
      line-height:1.15;
    }
    .sub{
      margin: 0 auto 18px;
      max-width: 50ch;
      font-size: 15px;
      opacity: .85;
    }

    .bigHeart{
      width: 92px;
      height: 92px;
      margin: 10px auto 6px;
      border-radius: 24px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.2)),
        linear-gradient(135deg, var(--pink), var(--pink2));
      transform: rotate(6deg);
      box-shadow: 0 18px 40px rgba(255,77,109,.35);
      position:relative;
    }
    .bigHeart span{
      font-size: 44px;
      transform: rotate(-6deg);
      animation: bop 1.6s infinite;
    }
    @keyframes bop{
      0%,100%{ transform: rotate(-6deg) scale(1); }
      50%{ transform: rotate(-6deg) scale(1.08); }
    }

    .buttons{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 12px;
      position:relative;
      min-height: 56px;
    }

    button{
      border:0;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 16px;
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      font-weight: 650;
      user-select:none;
    }

    .yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 12px 24px rgba(255,77,109,.35);
    }
    .yes:hover{ transform: translateY(-2px); filter: brightness(1.03); }

    .no{
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
      position:relative;
    }
    .no:hover{ transform: translateY(-2px); }

    .msg{
      margin-top: 16px;
      min-height: 44px;
      font-size: 18px;
      font-weight: 650;
    }
    .type{
      display:inline-block;
      border-right: 2px solid rgba(0,0,0,.35);
      padding-right: 3px;
      animation: caret .9s step-end infinite;
    }
    @keyframes caret{
      50%{ border-color: transparent; }
    }

    .tiny{
      font-size: 13px;
      opacity: .75;
      margin-top: 8px;
    }

    /* Confetti */
    .confetti{
      position:absolute;
      width:10px; height:14px;
      opacity:.9;
      top:-20px;
      animation: confettiFall linear forwards;
      pointer-events:none;
    }
    @keyframes confettiFall{
      to{
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.95;
      }
    }

    /* Quiz UI */
    .quiz{
      max-height: 55vh;
      overflow-y: auto;
      text-align:left;
      margin-top: 14px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 18px;
      padding: 14px;
    }

    .quizTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .pill{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.07);
      white-space:nowrap;
    }

    .qTitle{
      font-size: 16px;
      font-weight: 750;
      margin: 2px 0 10px;
      text-align:center;
    }

    .options{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content:center;
    }
    .opt{
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 10px 18px rgba(0,0,0,.08);
      font-size: 14px;
      padding: 10px 12px;
    }
    .opt:hover{ transform: translateY(-2px); }

    .barWrap{
      flex:1;
      height: 10px;
      background: rgba(0,0,0,.08);
      border-radius: 999px;
      overflow:hidden;
      min-width: 160px;
    }
    .bar{
      height:100%;
      width: 0%;
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      border-radius: 999px;
      transition: width .25s ease;
    }

    .summary{
      margin-top: 12px;
      text-align:left;
      font-size: 14px;
      line-height: 1.35;
    }
    .summaryItem{
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(0,0,0,.06);
      margin: 8px 0;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content:center;
      margin-top: 12px;
    }

    .secondary{
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 10px 18px rgba(0,0,0,.08);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="badge"><span class="pulseDot"></span> special question incoming 💌</div>

    <div class="bigHeart"><span>💘</span></div>
    <h1>Will you be my Valentine?</h1>
    <p class="sub" id="subtitle">I promise good vibes, snacks, and main-character energy ✨</p>

    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn">Yes 💖</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="tiny" id="hint">Tip: try hovering the “No” button 😄</div>

    <!-- Quiz container (hidden until YES) -->
    <div class="quiz" id="quiz" style="display:none;">
      <div class="quizTop">
        <div class="pill" id="stepPill">Question 1 / 10</div>
        <div class="barWrap" aria-label="progress">
          <div class="bar" id="bar"></div>
        </div>
        <div class="pill" id="moodPill">✨ fun mode</div>
      </div>

      <div class="qTitle" id="qTitle"></div>
      <div class="options" id="options"></div>

      <div class="actions" id="afterActions" style="display:none;">
        <button class="yes" id="restartBtn">Replay 🔁</button>
        <button class="secondary" id="downloadBtn">Download answers ⬇️</button>
      </div>

      <div class="summary" id="summary" style="display:none;"></div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const msg    = document.getElementById("msg");
    const hint   = document.getElementById("hint");
    const buttons = document.getElementById("buttons");
    const card = document.getElementById("card");
    const subtitle = document.getElementById("subtitle");

    const quiz = document.getElementById("quiz");
    const stepPill = document.getElementById("stepPill");
    const bar = document.getElementById("bar");
    const qTitle = document.getElementById("qTitle");
    const options = document.getElementById("options");
    const summary = document.getElementById("summary");
    const afterActions = document.getElementById("afterActions");
    const restartBtn = document.getElementById("restartBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    // --- Floating hearts in background ---
    const hearts = ["💗","💖","💘","💝","💞","💕","✨","🌸"];
    function spawnHeart(){
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (12 + Math.random()*26) + "px";
      el.style.animationDuration = (4 + Math.random()*5) + "s";
      el.style.opacity = (0.22 + Math.random()*0.55).toFixed(2);
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
    setInterval(spawnHeart, 240);

    // --- Typewriter message ---
    function typewriter(text){
      msg.innerHTML = "";
      const span = document.createElement("span");
      span.className = "type";
      msg.appendChild(span);
      let i = 0;
      const t = setInterval(() => {
        span.textContent = text.slice(0, i++);
        if(i > text.length){
          clearInterval(t);
          span.classList.remove("type");
        }
      }, 28);
    }

    // --- Confetti burst ---
    function confettiBurst(count = 120){
      for(let i=0;i<count;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360} 90% 65%)`;
        c.style.animationDuration = (2.5 + Math.random()*2.2) + "s";
        document.body.appendChild(c);
        c.addEventListener("animationend", () => c.remove());
      }
    }

    // --- No button dodge (kept inside the card area) ---
    let dodges = 0;
    function dodgeNo(){
      dodges++;
      noBtn.style.position = "absolute";

      const area = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();
      const padding = 8;

      const maxX = area.width - btn.width - padding;
      const maxY = area.height - btn.height - padding;

      const x = Math.max(padding, Math.random() * Math.max(maxX, padding));
      const y = Math.max(padding, Math.random() * Math.max(maxY, padding));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      if(dodges === 3) hint.textContent = "Okayyyy that button is slippery 😭";
      if(dodges === 6) hint.textContent = "At this point… just say yes 😌💖";
      if(dodges >= 9) hint.textContent = "No has left the chat 🫠";
    }
    noBtn.addEventListener("mouseover", dodgeNo);
    noBtn.addEventListener("click", dodgeNo);
    noBtn.addEventListener("mouseover", () => { buttons.style.minHeight = "92px"; }, { once:true });

    // --- Quiz questions (NOT only couple oriented) ---
    const QUESTIONS = [
      { q: "Pick a vibe for today ✨", a: ["Cozy ☕", "Chaotic 😭", "Productive 💪", "Cute 💖"] },
      { q: "Choose a snack champion 🍿", a: ["Chips", "Chocolate", "Fruit", "Ice cream"] },
      { q: "Your energy right now is…", a: ["100% 🔥", "75% 😌", "40% 🫠", "Need coffee ☕"] },
      { q: "If we do something fun, it’s:", a: ["Movie 🎬", "Games 🎮", "Drive 🚗", "Food hunt 🍔"] },
      { q: "Pick a color mood 🎨", a: ["Pink 💗", "Blue 💙", "Purple 💜", "Black 🖤"] },
      { q: "What’s your comfort thing?", a: ["Music 🎧", "Sleep 😴", "Gym 💪", "Talk 🫶"] },
      { q: "A small thing that makes you happy:", a: ["Compliments 🥹", "Sunset 🌅", "Cute pets 🐾", "Good food 🍜"] },
      { q: "Choose a superpower 🦸", a: ["Teleport 🚀", "Mind read 🧠", "Time pause ⏸️", "Unlimited money 💸"] },
      { q: "Which one are you?", a: ["Planner 📅", "Go with flow 🌊", "Last minute 😅", "Depends 🫠"] },
      { q: "Final check ✅ Will you be my Valentine?", a: ["Yes 💖", "Of course 😌", "Forever 💍", "Absolutely 🥰"] }
    ];

    let idx = 0;
    const answers = [];

    function updateProgress(){
      stepPill.textContent = `Question ${idx+1} / ${QUESTIONS.length}`;
      const pct = Math.round(((idx) / QUESTIONS.length) * 100);
      bar.style.width = pct + "%";
    }

    function renderQuestion(){
      updateProgress();
      const item = QUESTIONS[idx];
      qTitle.textContent = item.q;
      options.innerHTML = "";

      item.a.forEach(choice => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = choice;
        b.onclick = () => {
          answers.push({ question: item.q, answer: choice });
          idx++;

          // little micro-feedback
          confettiBurst(16);

          if(idx >= QUESTIONS.length){
            showSummary();
          } else {
            renderQuestion();
          }
        };
        options.appendChild(b);
      });
    }

    function showSummary(){
      // progress full
      bar.style.width = "100%";
      stepPill.textContent = `Done ✅`;

      qTitle.textContent = "Aww cute. Here are your answers 💖";
      options.innerHTML = "";
      summary.style.display = "block";
      afterActions.style.display = "flex";

      const lines = [];
      summary.innerHTML = answers.map((x, i) => {
        const line = `${i+1}. ${x.question} → ${x.answer}`;
        lines.push(line);
        return `<div class="summaryItem"><b>${i+1}.</b> ${x.question}<br><span style="opacity:.85">Answer:</span> ${x.answer}</div>`;
      }).join("");

      // also show a sweet message at top
      typewriter("Okay that was adorable 🥹💖");
      hint.textContent = "You can replay or download the answers below ✨";

      // store for download
      downloadBtn.onclick = () => {
        const text =
          "Valentine Quiz Answers 💘\n\n" +
          lines.join("\n") +
          "\n\nMade with 💖";
        const blob = new Blob([text], {type:"text/plain"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "valentine-answers.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      restartBtn.onclick = () => {
        idx = 0;
        answers.length = 0;
        summary.style.display = "none";
        afterActions.style.display = "none";
        hint.textContent = "";
        typewriter("One More Round? 😄✨");
        renderQuestion();
      };
      summary.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function startExperience(){
      yesBtn.disabled = true;
      noBtn.disabled = true;
      buttons.style.display = "none";
      subtitle.textContent = "YAY!! 💖 Now 10 quick fun questions…";
      hint.textContent = "";

      card.style.transform = "scale(1.01)";
      card.style.transition = "transform .2s ease";

      typewriter("You just unlocked the fun quiz ✨");
      confettiBurst(140);

      // show quiz
      quiz.style.display = "block";
      idx = 0;
      answers.length = 0;
      summary.style.display = "none";
      afterActions.style.display = "none";
      renderQuestion();
    }

    yesBtn.addEventListener("click", startExperience);
  </script>
</body>
</html>
